rsp-bound-frame-and-material-grouping:
  file: rsp-bound-frame-and-material-grouping.md
  description: When doing renderer perf work — the frame is RSP-bound (rspq_wait), so target RSP command count / DMA traffic not CPU loops; global material grouping uses direct emission not per-(cell,material) blocks; Ares boots with expanded memory so compare [memory] used as a fraction of total.
tile-streamer-compaction:
  file: tile-streamer-compaction.md
  description: When touching tile streaming / resident-set compaction — in-place array rewrite while searching the same array silently drops the old center (missing geometry + heap-leak crash); snapshot old state first; check streaming telemetry (kept cells reloaded?) before render math.

rsp-bound-frame-and-material-grouping:
  file: rsp-bound-frame-and-material-grouping.md
  description: When doing renderer perf work — the frame is RSP-bound (rspq_wait), so target RSP command count / DMA traffic not CPU loops; global material grouping uses direct emission not per-(cell,material) blocks; Ares boots with expanded memory so compare [memory] used as a fraction of total.
tile-streamer-compaction:
  file: tile-streamer-compaction.md
  description: When touching tile streaming / resident-set compaction — in-place array rewrite while searching the same array silently drops the old center (missing geometry + heap-leak crash); snapshot old state first; check streaming telemetry (kept cells reloaded?) before render math.
n64-opt-device-verify-and-telemetry:
  file: n64-opt-device-verify-and-telemetry.md
  description: When verifying N64 ROM changes autonomously (no controller, user away) — kDebugAutoWalk + tools/capture_baseline.sh (rom, wall_seconds, label) is the walk mechanism; near_batches 56 stationary vs 94 walking is the fast signal ([memory] fires only every 3600 frames); elf size delta proves a debug flag is in/out of the build; docs drift from device telemetry — cite the latest capture, not the doc (real arena 2.16 MB stationary / 2.29 MB walking, not the stale 5.48 MB); measure before micro-optimizing (update was 0.194 ms = 0.6% of the RSP-bound frame, gate failed, opt skipped).
stale-contract-vs-working-tree:
  file: stale-contract-vs-working-tree.md
  description: A pre-existing failing test may encode a STALE default, not a bug — before "restoring" a value to satisfy a contract, compare evidence (latest device capture > working tree > comments > test); backcull=false was the user's floor-texture fix and the true-defaulting contract was stale.
climb-probe-shell-geometry-coupling:
  file: climb-probe-shell-geometry-coupling.md
  description: When porting climb/wall physics or OG Celeste64 movement — the probe radius and the collision radius that determines where the body rests are ONE coupled system (change together, verify zero-popout equilibrium over 30 ticks); entry probe uses the visibility radius (5.0) not climb_check_dist (4) because at tangency the waist rests 1 unit beyond r4 reach; the plane query projects onto the INFINITE face plane so a lip probe above a wall top still "hits" — bound it to the matching wall faces' vertex extents (project the probe onto the plane first); a raw grip-probe reset in the mantle counter suppresses the mantle at the real lip; corner rays must be room!=nullptr guarded; side-ray direction = move intent projected onto the wall tangent plane, not a world-axis ray; force-corner ease must gate on a genuinely NEW wall (face_id differs) or a plain up-climb triggers it every tick.
climb-ease-must-keep-destination:
  file: ../common-mistakes/climb-ease-must-keep-destination.md
  description: When turning a climb corner — the 0.2 s ease is one kinematic handoff; retain destination wall/grip, allow explicit release, suspend normal grip/facing gates, bound destination anchor reach, restore the pre-adoption ease origin, and validate on a real baked edge.
og-single-mover-port:
  file: og-single-mover-port.md
  description: When porting OG Celeste64 movement/collision or doing single-mover vs multi-path collision work — OG has ONE SweepTestMove+Popout per tick; the demake's four parallel repair paths caused persistent clip bugs. Port = relocate + gate-change, NOT re-port validated feel math. OG wall test is a SEPARATE if (not else after ground); Popout returns true only for wall pops; one-way pass-through means floor gate accepts at-or-above, ceiling gate rejects below; zero-amount SweepMove must still idle-popout; skid needs a real floor in host fixtures; feet-anchored conversion (center = hit + half_height).
sweep-contact-flags-must-accumulate:
  file: ../common-mistakes/sweep-contact-flags-must-accumulate.md
  description: When splitting one movement tick into collision substeps — Popout is repair, not a tick boundary; clear death/ceiling result flags once at SweepMove entry, then accumulate hits across every substep, step-up, and ground-snap path. Regression sweeps across a narrow death strip and verifies final contact survives after leaving it.
takeoff-needs-ground-snap-cancel:
  file: ../common-mistakes/takeoff-needs-ground-snap-cancel.md
  description: When porting ground-snap cooldown — grep both reader and writers; OG arms it at takeoff sites and on EVERY held climb tick (Player.cs:1473). Missing sustained-climb refresh lets a floor-supported climb step get snap-pulled back down. Guard grounded wall entry plus real-map approach/climb/mantle; see .agents/common-mistakes/takeoff-needs-ground-snap-cancel.md.
fixed-step-backlog-must-be-visible:
  file: ../common-mistakes/fixed-step-backlog-must-be-visible.md
  description: When bounding fixed-step simulation work — cap ticks per frame without silently discarding short hitches; carry a bounded backlog, trace pending ticks and dropped time, and test both catch-up and long-stall behavior.
memory-opt-pooling-and-budget:
  file: memory-opt-pooling-and-budget.md
  description: When doing renderer pooling / memory-budget work — bump allocators MUST 16-align every allocation (MIPS misaligned-write crash); malloc_uncached is memalign on the SAME arena (not a separate pool); per-slot buffers for persistent + ONE shared scratch for transient (parses are serialized) is the footprint-safe pool shape; DMA-direct buffers rewritten per frame (reveal matrix) stay uncached (per-frame cache flush hazard); the edit tool is atomic per call (verify all blocks landed after a failed+retried edit); Ares "early exits" during captures can be the user closing the window; the alignment audit contract must be re-run after pooling (per-file malloc counts drift).
controls-physics-port:
  file: controls-physics-port.md
  description: When converting hand-switched player blocks into a real state machine, adding OG-parity gameplay handlers (spring), or changing the climb grab gate — pre-FSM state-independent blocks create same-tick transition cascades (Skidding→Dashing still cascades; OG runs TryDash from Normal AND Skidding); a "gate" test can be dead code when the AABB prefilter is tighter than the test window (the height-band was a no-op — validate discriminators empirically against the real baked CMSH); winding-independent grab front-side = overhead-clearance reject (solid within 8 above the waist → overhang lip), measured 0% impact on the real map; probe fixtures gain a `reversed` flag on WALL faces only (the floor keeps its winding); device capture with fake input = temp gated steering + revert, and never pkill Ares in the same shell that launches it (self-match kills the launcher).
